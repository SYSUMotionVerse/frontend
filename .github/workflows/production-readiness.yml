name: Production readiness

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      ALLOW_CI_RELEASE_PLACEHOLDERS: 'true'
      VITE_API_BASE_URL: https://api.ci.invalid/api
      VITE_POSE_MODEL_BASE_URL: https://models.ci.invalid/pose/ci-model
      VITE_POSE_MODEL_VERSION: ci-model

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run TypeScript checks
        run: pnpm exec vue-tsc --noEmit

      - name: Check production configuration
        run: pnpm release:check

      - name: Audit production dependency graph
        run: pnpm audit:production

      - name: Build and verify mp-weixin production bundle
        run: pnpm build:mp-weixin:production
